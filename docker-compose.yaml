services:

  ecoscolar-api-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecoscolar-api-database
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_TCP_PORT: "1444"
    volumes:
      - mssql-ecoscolar-data:/var/opt/mssql
    networks:
      - databases
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost,1444 -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s

  # -----------------------------
  # Ecoscolar Web API
  # -----------------------------
  ecoscolar-web-api:
    build: EcoScolarWebApi
    container_name: ecoscolar-web-api
    depends_on:
      ecoscolar-api-database:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ApplyDatabaseMigrations: "true"
      Features__UseFakeAdvertSearch: "false"
      ConnectionStrings__Default: "Server=ecoscolar-api-database,1444;Initial Catalog=ecoscolar;User ID=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Smtp__Host: ecoscolar-mailpit
      Smtp__Port: 1025
      Minio__Endpoint: ecoscolar-minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL}
    networks:
      - dmz
      - ecoscolar
      - databases
    labels:
      - "wud.watch=true"
      - "wud.trigger.docker.apply=true"
      - "wud.trigger.docker.apply.mode=onnewimage"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s

  # -----------------------------
  # Nginx API Gateway
  # -----------------------------
  ecoscolar-gateway-backend:
    build: ecoscolar-gateway-backend
    container_name: ecoscolar-gateway-backend
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      ecoscolar-web-api:
        condition: service_healthy
    networks:
      - dmz
      - ecoscolar
      - databases
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # MinIO - S3-compatible local object storage
  # -----------------------------
  ecoscolar-minio:
    image: minio/minio:latest
    container_name: ecoscolar-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-ecoscolar-data:/data
    networks:
      - ecoscolar
      - dmz
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # Mailpit - SMTP Server and Web UI for Testing Emails
  # -----------------------------
  ecoscolar-mailpit:
    image: axllent/mailpit:latest
    container_name: ecoscolar-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_WEBROOT=/
    networks:
      - ecoscolar 
      - dmz  

networks:
  dmz:
    driver: bridge
  databases:
    driver: bridge
    internal: true
  ecoscolar:
    driver: bridge
    internal: true

volumes:
  mssql-ecoscolar-data:
  minio-ecoscolar-data:
