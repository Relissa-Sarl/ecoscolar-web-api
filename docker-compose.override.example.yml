# Override LOCAL uniquement (gitignore). Ne pas committer docker-compose.override.yml.
#
# Usage machine "ecole" / Pi :
#   .\scripts\docker-up.ps1
# ou manuellement :
#   Copy-Item docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d
#
# Expose SQL Server sur le host pour le Pi via Tailscale.
# Ne pas ajouter ASPNETCORE_ENVIRONMENT=Development sur ecoscolar-web-api :
# l'API Docker doit rester en Production pour utiliser la connexion SQL du compose.
services:
  ecoscolar-api-database:
    ports:
      - "0.0.0.0:1433:1433"
    networks:
      - databases
      - dmz
